apiVersion: apps/v1
kind: Deployment
metadata:
  name: setuhaul-service
  namespace: setuhaul
  labels:
    app.kubernetes.io/name: setuhaul-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: setuhaul-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setuhaul-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setuhaul-service
          image: 883416059014.dkr.ecr.ap-southeast-2.amazonaws.com/setuhaul-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "service.py"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--db"
            - "/data/setuhaul.sqlite"
            - "--live"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: setuhaul-nvidia-api-key
                  key: NVIDIA_API_KEY
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: setuhaul-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
