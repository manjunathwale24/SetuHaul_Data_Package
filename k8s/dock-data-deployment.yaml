apiVersion: apps/v1
kind: Deployment
metadata:
  name: setuhaul-service
  namespace: setuhaul
  labels:
    app.kubernetes.io/name: setuhaul-service
  annotations:
    kubernetes.io/change-cause: "Add dock data feature - Operations Tower dock board"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: setuhaul-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setuhaul-service
    spec:
      containers:
        - name: setuhaul-service
          image: 883416059014.dkr.ecr.ap-southeast-2.amazonaws.com/setuhaul-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: "768Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: setuhaul-nvidia-api-key
                  key: nvidia-api-key
            - name: DDB_TABLE
              value: "setuhaul-devops-errors"
          command: ["python"]
          args:
            - service.py
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --db
            - /data/setuhaul.sqlite
            - --live
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: setuhaul-data
            readOnly: false
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: setuhaul-service
  namespace: setuhaul
  labels:
    app.kubernetes.io/name: setuhaul-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: setuhaul-service
